# What Linux cannot do: run the iOS unit tests, link the iOS framework and
# build the iOS app with Xcode.
# macOS runner minutes cost 10x Linux minutes on private repositories, so this
# runs on pushes to master and on demand (Actions tab → iOS → Run workflow).
name: iOS

on:
  push:
    branches: [master]
    paths-ignore:
      # Files the build and tests never read (verified: referenced only in
      # comments). A push runs anyway if any other file changed. Never add
      # .forge/verify.sh, Gradle files, lockfiles or .github/ here.
      - "docs/**"
      - "**/*.md"
      - ".forge/ember/**"
      # FORGE's own bookkeeping, committed after each landed run
      - ".forge/backlog/**"
      - ".forge/failure_memory.yaml"
      - ".forge/policies/proposed/**"
  workflow_dispatch:
  pull_request:   # TEMPORARY — proves the new iOS project on this PR; removed before merge

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    # Pinned (Apple Silicon, needed for iosSimulatorArm64): Xcode changes with the
    # image, so new macOS versions are adopted deliberately.
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}
      - name: iOS unit tests (simulator)
        run: ./gradlew iosSimulatorArm64Test --no-daemon
      - name: Link iOS framework
        run: ./gradlew :shared:ui:linkDebugFrameworkIosSimulatorArm64 --no-daemon
      # Builds the actual app (iosApp/, SwiftUI entry point) the way Xcode does,
      # including its Gradle build phase. Simulator, unsigned: no Apple account
      # or certificates needed. Catches Swift-side and Xcode-project breakage.
      - name: Build iOS app (Xcode, simulator, unsigned)
        run: |
          xcodebuild -version
          xcodebuild build \
            -project iosApp/iosApp.xcodeproj \
            -target iosApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -arch arm64 \
            CODE_SIGNING_ALLOWED=NO \
            | tail -n 60
          exit "${PIPESTATUS[0]}"
