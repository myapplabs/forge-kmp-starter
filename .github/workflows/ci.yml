# Build + unit tests on every push and pull request — the same checks FORGE
# runs locally (.forge/verify.sh): Android compile, iOS Kotlin compile
# (cross-compiled on Linux), and all host-runnable unit tests.
name: CI

on:
  push:
    paths-ignore:
      # Files the build and tests never read (verified: referenced only in
      # comments). A push runs anyway if any other file changed. Never add
      # .forge/verify.sh, Gradle files, lockfiles or .github/ here.
      - "docs/**"
      - "**/*.md"
      - ".forge/ember/**"
      # FORGE's own bookkeeping, committed after each landed run
      - ".forge/backlog/**"
      - ".forge/failure_memory.yaml"
      - ".forge/policies/proposed/**"
  pull_request:
    paths-ignore: ["docs/**", "**/*.md", ".forge/ember/**", ".forge/backlog/**", ".forge/failure_memory.yaml", ".forge/policies/proposed/**"]   # same list as push
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # Pinned: image changes are adopted deliberately (see canary.yml).
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      # Actions are pinned to release commits (supply-chain policy, as in FORGE).
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      # Caches Gradle and Kotlin/Native downloads; validates the wrapper jar checksum.
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}
      - name: Verify (build + tests)
        run: bash .forge/verify.sh
